<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DOCX → XLSX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;display:flex;justify-content:center;min-height:100vh;font-family:Arial,sans-serif;padding:32px 16px}
.wrap{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:18px}

.mode-row{display:flex;border:1px solid #2a2a2a;border-radius:8px;overflow:hidden;width:100%}
.mode-btn{flex:1;background:#161616;color:#555;border:none;padding:9px;font-size:11px;letter-spacing:.8px;cursor:pointer;transition:background .15s,color .15s}
.mode-btn.active{background:#252525;color:#ddd}
.mode-btn:hover:not(.active){background:#1c1c1c;color:#888}

.panel{width:100%;display:none;flex-direction:column;align-items:center;gap:16px}
.panel.active{display:flex}

.icon-btn{
  width:80px;height:80px;border-radius:50%;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;font-size:10px;font-weight:bold;letter-spacing:.8px;color:#fff;
  transition:transform .15s,filter .15s;flex-shrink:0;
}
.icon-btn:hover:not(:disabled){transform:scale(1.08);filter:brightness(1.2)}
.icon-btn:active:not(:disabled){transform:scale(.96)}
.icon-btn svg{width:26px;height:26px}
.icon-btn:disabled{opacity:.3;cursor:not-allowed}
.btn-docx   {background:#1a3a5c}
.btn-img    {background:#3a2a10}
.btn-xlsx   {background:#1a3a1a}
.btn-convert{background:#222}
.btn-zip    {background:#1a1a3a}
.btn-merge  {background:#222}

input[type=file]{display:none}

.dots{display:flex;gap:4px;align-items:center}
.dot{width:5px;height:5px;border-radius:50%;background:#222}

.upload-row{display:flex;gap:20px;align-items:flex-start;justify-content:center}
.upload-col{display:flex;flex-direction:column;align-items:center;gap:6px}
.upload-sub{font-size:10px;letter-spacing:1px;color:#444;text-align:center}

.pill-scroll{max-height:160px;overflow-y:auto;width:100%;display:flex;flex-direction:column;gap:5px}
.pill{background:#191919;border-radius:24px;padding:6px 12px;display:flex;align-items:center;gap:8px;font-size:11px;color:#888;border:1px solid #242424}
.pill-ico{font-size:13px;flex-shrink:0}
.pill-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-st{font-size:13px;flex-shrink:0}
.pill .dl{background:transparent;border:1px solid #2a5a2a;color:#4caf50;border-radius:16px;padding:2px 8px;font-size:10px;cursor:pointer;flex-shrink:0}
.pill .dl:hover{background:#1a2a1a}

.match-table{width:100%;background:#161616;border-radius:12px;border:1px solid #232323;overflow:hidden;display:none}
.match-head{display:grid;grid-template-columns:1fr 34px;padding:8px 14px;font-size:10px;color:#3a3a3a;letter-spacing:.8px;border-bottom:1px solid #1e1e1e}
.match-body{max-height:320px;overflow-y:auto}
.mrow{display:grid;grid-template-columns:1fr 34px;padding:7px 14px;border-bottom:1px solid #1b1b1b;align-items:center;gap:8px}
.mrow:last-child{border-bottom:none}
.mrow.hit .recipe-name{color:#ccc}
.mrow.miss .recipe-name{color:#555}
.recipe-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .st{text-align:right;font-size:15px;flex-shrink:0}

.img-chip{display:flex;align-items:center;gap:6px;margin-top:2px}
.img-chip img{width:22px;height:22px;border-radius:4px;object-fit:cover;border:1px solid #333}
.img-chip span{font-size:10px;color:#4a7a4a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}

.manual-upload-btn{
  background:transparent;border:1px solid #4a2a0a;color:#a06020;
  border-radius:14px;padding:2px 8px;font-size:10px;cursor:pointer;white-space:nowrap;
}
.manual-upload-btn:hover{background:#2a1a08}

.counter{font-size:11px;color:#444;text-align:center}
.counter b{color:#666}
.counter .c-hit{color:#3a7a3a}
.counter .c-miss{color:#7a3a3a}

@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:12px;height:12px;border:2px solid #333;border-top-color:#888;border-radius:50%;animation:spin .6s linear infinite}

.divlabel{font-size:10px;color:#333;letter-spacing:1.2px}

/* info badge */
.badge{font-size:10px;color:#3a6a3a;background:#0e1e0e;border:1px solid #1a3a1a;border-radius:8px;padding:5px 12px;text-align:center;width:100%}
</style>
</head>
<body>
<div class="wrap">

<div class="mode-row">
  <button class="mode-btn active" id="modeA" onclick="setMode('A')">DOCX → XLSX</button>
  <button class="mode-btn"        id="modeB" onclick="setMode('B')">XLSX + IMAGES</button>

<!-- ══════ PANEL A: DOCX → XLSX ══════ -->
<div class="panel active" id="panelA">

      </svg>UPLOAD
    </div>

  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

      <polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

      <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>

<!-- ══════ PANEL B: XLSX + IMAGES ══════ -->
<div class="panel" id="panelB">

  <div class="badge">Upload the .xlsx from Panel A + matching images → outputs .xlsx with real embedded images</div>

  <div class="upload-row">
    <div class="upload-col">
      <label><input type="file" id="inXlsx" accept=".xlsx,.csv" multiple>
        <div class="icon-btn btn-xlsx">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
          </svg>XLSX
        </div>
      </label>
      <div class="upload-sub" id="xlsxSub">0 FILES</div>

    <div style="color:#2a2a2a;font-size:22px;padding-top:24px">+</div>

            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <circle cx="8.5" cy="8.5" r="1.5"/>
            <polyline points="21 15 16 10 5 21"/>
          </svg>IMAGES

  <div class="match-table" id="matchTable">

    <div class="match-body" id="matchBody"></div>
  </div>

  <div class="counter" id="matchCounter" style="display:none"></div>

  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>

  <button class="icon-btn btn-merge" id="btnMerge" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/>
      <line x1="6" y1="9" x2="6" y2="15"/><line x1="9" y1="6" x2="15" y2="6"/>
      <line x1="9" y1="18" x2="15" y2="18"/>
    </svg>MERGE
  </button>

  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="pill-scroll" id="outPills"></div>

  <button class="icon-btn btn-zip" id="btnZipB" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
    </svg>ZIP
  </button>
</div>

</div><!-- /wrap -->
<script>
// ══════════════════════════════ UTILS ═══════════════════════════
function setMode(m){
  ['A','B'].forEach(x=>{
    document.getElementById('panel'+x).classList.toggle('active',x===m);
    document.getElementById('mode'+x).classList.toggle('active',x===m);
  });
}

// ── ZIP builder ──────────────────────────────────────────────
function crc32(d){
  let c=0xFFFFFFFF;
  for(let i=0;i<d.length;i++){c^=d[i];for(let j=0;j<8;j++)c=(c&1)?(c>>>1)^0xEDB88320:c>>>1;}
  return(c^0xFFFFFFFF)>>>0;
}
function buildZip(entries){
  const enc2=new TextEncoder(),lo=[],cd=[];let off=0;
  for(const e of entries){
    const nb=enc2.encode(e.name),db=e.bytes instanceof Uint8Array?e.bytes:new Uint8Array(e.bytes);
    const crc=crc32(db);
    const lh=new Uint8Array(30+nb.length),lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint32(14,crc,true);
    lv.setUint32(18,db.length,true);lv.setUint32(22,db.length,true);
    lv.setUint16(26,nb.length,true);lh.set(nb,30);
    const ch=new Uint8Array(46+nb.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,db.length,true);cv.setUint32(24,db.length,true);
    cv.setUint16(28,nb.length,true);cv.setUint32(42,off,true);ch.set(nb,46);
    lo.push(lh,db);cd.push(ch);off+=lh.length+db.length;
  }
  const cdSz=cd.reduce((s,c)=>s+c.length,0);
  const eocd=new Uint8Array(22),ev=new DataView(eocd.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(8,entries.length,true);
  ev.setUint16(10,entries.length,true);ev.setUint32(12,cdSz,true);ev.setUint32(16,off,true);
  const parts=[...lo,...cd,eocd],tot=parts.reduce((s,p)=>s+p.length,0);
  const out=new Uint8Array(tot);let pos=0;
  for(const p of parts){out.set(p,pos);pos+=p.length;}
  return out;
}
const enc=new TextEncoder();
function dlBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}

// ── Image name matching ──────────────────────────────────────
function cleanImgName(filename){
  return filename
    .replace(/\.[^.]+$/,'')
    .replace(/_\d{12,}$/,'')
    .replace(/_/g,' ')
    .toLowerCase()
    .replace(/[^a-z0-9\s]/g,'')
    .replace(/\s+/g,' ').trim();
}
function cleanTitle(t){
  return t.toLowerCase().replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
}
function matchScore(title,imgClean){
  const tw=cleanTitle(title).split(' ').filter(w=>w.length>2);
  if(!tw.length)return 0;
  const hits=tw.filter(w=>imgClean.includes(w)).length;
  return hits/tw.length;
}
function findImage(title,imgList){
  let best=null,bestScore=0;
  for(const img of imgList){
    const s=matchScore(title,img.clean);
    if(s>bestScore){bestScore=s;best=img;}
  }
  return bestScore>=0.6?best:null;
}

// ── Pill helpers ─────────────────────────────────────────────
function addPill(listId,icon,name,status,onDl){
  const l=document.getElementById(listId);
  const p=document.createElement('div');p.className='pill';
  p.innerHTML=`<span class="pill-ico">${icon}</span><span class="pill-name" title="${name}">${name}</span><span class="pill-st" id="pst_${name.replace(/\W/g,'_')}">${status}</span>`;
  if(onDl){const b=document.createElement('button');b.className='dl';b.textContent='↓';b.onclick=onDl;p.appendChild(b);}
  l.appendChild(p);
  return p;
}

// ── dataUrl → ArrayBuffer ────────────────────────────────────
function dataUrlToBuffer(dataUrl){
  const base64=dataUrl.split(',')[1];
  const bin=atob(base64);
  const buf=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
  return buf.buffer;
}

function dataUrlToExtension(dataUrl){
  const mime=dataUrl.split(';')[0].split(':')[1]||'';
  const map={'image/jpeg':'jpeg','image/jpg':'jpeg','image/png':'png','image/gif':'gif','image/webp':'webp','image/bmp':'bmp'};
  return map[mime]||'png';
}

// ══════════════════════════════ XLSX BUILDER ══════════════════
// Builds a real .xlsx from recipe rows + optional image map
// imageMap: { title (string) → { dataUrl, name } }
async function buildXlsx(rows, imageMap){
  imageMap = imageMap || {};
  const wb = new ExcelJS.Workbook();
  wb.creator = 'DOCX→XLSX Converter';
  const ws = wb.addWorksheet('Recipes');

  // Determine columns from first row
  const firstRow = rows[0] || {};
  const keys = Object.keys(firstRow);

  // Header row
  const headerRow = ws.addRow(keys);
  headerRow.font = {bold:true, color:{argb:'FFFFFFFF'}};
  headerRow.fill = {type:'pattern', pattern:'solid', fgColor:{argb:'FF1E3A5F'}};
  headerRow.height = 20;

  // Column widths
  keys.forEach((k,i)=>{
    const col = ws.getColumn(i+1);
    col.key = k;
    if(k.endsWith('_Image')) col.width = 22;
    else if(k.endsWith('_Title')) col.width = 28;
    else if(k.endsWith('_Ingredients')||k.endsWith('_Directions')) col.width = 40;
    else col.width = 18;
  });

  // Data rows — image columns get tall rows
  const IMAGE_ROW_HEIGHT = 120; // px ≈ 90pt
  const dataRows = [];
  for(const row of rows){
    const values = keys.map(k => row[k]||'');
    const xlRow = ws.addRow(values);
    xlRow.alignment = {wrapText:true, vertical:'top'};

    // Check if this row has any images
    const hasImg = keys.some(k => k.endsWith('_Image') && row[k]);
    if(hasImg) xlRow.height = IMAGE_ROW_HEIGHT;

    dataRows.push(xlRow);
  }

  // Embed images into image columns
  const imgColIndices = keys.reduce((acc,k,i)=>{if(k.endsWith('_Image'))acc.push({key:k,col:i});return acc;},[]);

  for(let ri=0;ri<rows.length;ri++){
    const row = rows[ri];
    const xlRowNum = ri + 2; // 1-indexed, row 1 is header

    for(const {key,col} of imgColIndices){
      // Determine which title this image col belongs to
      const titleKey = key.replace('_Image','_Title');
      const title = (row[titleKey]||'').trim();

      // Find image: check imageMap first, then dataUrl already in row
      let imgEntry = title ? imageMap[title] : null;
      if(!imgEntry && row[key] && row[key].startsWith('data:')){
        imgEntry = {dataUrl: row[key], name: 'image'};
      }

      if(!imgEntry || !imgEntry.dataUrl) continue;

      try{
        const ext = dataUrlToExtension(imgEntry.dataUrl);
        const buf = dataUrlToBuffer(imgEntry.dataUrl);
        const imgId = wb.addImage({buffer: buf, extension: ext});

        // Place image inside the cell (tl = top-left corner of cell)
        ws.addImage(imgId, {
          tl: { col: col, row: xlRowNum - 1 },
          br: { col: col + 1, row: xlRowNum },
          editAs: 'oneCell'
        });

        // Clear the cell text (don't want the data URL as text)
        ws.getCell(xlRowNum, col+1).value = '';
      }catch(e){
        console.warn('Image embed failed for', title, e);
      }
    }
  }

  // Freeze top row
  ws.views = [{state:'frozen', ySplit:1}];

  // Generate buffer
  const buffer = await wb.xlsx.writeBuffer();
  return new Uint8Array(buffer);
}

// ══════════════════════════════ PANEL A ══════════════════════
let docxFiles=[];

function clean(t){return t.replace(/\s+/g,' ').trim();}
function parseRecipes(text){
  const lines=text.split('\n').map(clean).filter(l=>l);
  let R=[],cur=null,sec=null,dc=1;
  for(const line of lines){
    const lo=line.toLowerCase();
    if(lo.startsWith('recipe title:')){
      if(cur)R.push(cur);
      cur={Title:line.split(':')[1]?.trim()||'',Prep:'',Total:'',Serves:'',Ingredients:'',Directions:'',Notes:''};
      sec=null;dc=1;continue;
    }
    if(!cur)continue;
    if(lo.startsWith('prep time')){cur.Prep=line.split(':')[1]?.trim()||'';continue;}
    if(lo.startsWith('total time')){cur.Total=line.split(':')[1]?.trim()||'';continue;}
    if(lo.startsWith('serves')){cur.Serves=line.split(':')[1]?.trim()||'';continue;}
    if(lo.startsWith('ingredients')){sec='I';continue;}
    if(lo.startsWith('directions')){sec='D';continue;}
    if(lo.startsWith('notes')||lo.startsWith('nutrition')){sec='N';continue;}
    if(sec==='I')cur.Ingredients+='• '+line+'\n';
    if(sec==='D')cur.Directions+=dc+++'. '+line+'\n';
    if(sec==='N')cur.Notes+='• '+line+'\n';
  }
  if(cur)R.push(cur);return R;
}

function makeRows(recipes){
  const rows=[];
  for(let i=0;i<recipes.length;i+=2){
    const t=recipes[i],b=recipes[i+1]||{};
    rows.push({
      Top_Title:t.Title||'',
      Top_Prep:t.Prep||'',
      Top_Total:t.Total||'',
      Top_Serves:t.Serves||'',
      Top_Ingredients:t.Ingredients||'',
      Top_Directions:t.Directions||'',
      Top_Notes:t.Notes||'',
      Top_Image:'',
      Bottom_Title:b.Title||'',
      Bottom_Prep:b.Prep||'',
      Bottom_Total:b.Total||'',
      Bottom_Serves:b.Serves||'',
      Bottom_Ingredients:b.Ingredients||'',
      Bottom_Directions:b.Directions||'',
      Bottom_Notes:b.Notes||'',
      Bottom_Image:''
    });
  }
  return rows;
}

function updateDocxCtr(){
  const done=docxFiles.filter(f=>f.status==='done').length,tot=docxFiles.length;
  const el=document.getElementById('docxCounter');
  el.style.display=tot?'block':'none';
  el.innerHTML=`<b>${done}</b> / ${tot} ready`;
}

document.getElementById('inDocx').addEventListener('change',function(e){
  const nf=[...e.target.files].filter(f=>f.name.toLowerCase().endsWith('.docx'));
  for(const f of nf){
    const base=f.name.replace(/\.docx$/i,'');
    const pill=addPill('docxPills','📄',f.name,'⏳',null);
    docxFiles.push({file:f,base,status:'idle',rows:null,pill});
  }
  document.getElementById('btnConvert').disabled=false;
  updateDocxCtr();this.value='';
});

document.getElementById('btnConvert').addEventListener('click',async()=>{
  document.getElementById('btnConvert').disabled=true;
  for(const e of docxFiles.filter(f=>f.status==='idle')){
    e.pill.querySelector('.pill-st').innerHTML='<span class="spin"></span>';
    try{
      const ab=await e.file.arrayBuffer();
      const r=await mammoth.extractRawText({arrayBuffer:ab});
      const rec=parseRecipes(r.value);
      if(!rec.length)throw new Error('No recipes found');
      e.rows=makeRows(rec);
      e.status='done';
      e.pill.querySelector('.pill-st').textContent='✅';
      const b=document.createElement('button');b.className='dl';b.textContent='↓';
      b.onclick=async()=>{
        const bytes=await buildXlsx(e.rows,{});
        dlBlob(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),e.base+'.xlsx');
      };
      e.pill.appendChild(b);
    }catch(err){
      console.error(err);
      e.status='error';
      e.pill.querySelector('.pill-st').textContent='❌';
    }
    updateDocxCtr();
  }
  document.getElementById('btnZipA').disabled=!docxFiles.some(f=>f.status==='done');
  document.getElementById('btnConvert').disabled=docxFiles.every(f=>f.status!=='idle');
});

document.getElementById('btnZipA').addEventListener('click',async()=>{
  const ready=docxFiles.filter(f=>f.status==='done');
  if(!ready.length)return;
  document.getElementById('btnZipA').disabled=true;
  document.getElementById('btnZipA').querySelector('svg').style.opacity='0.3';
  const zipEntries=[];
  for(const f of ready){
    const bytes=await buildXlsx(f.rows,{});
    zipEntries.push({name:f.base+'.xlsx',bytes});
  }
  dlBlob(new Blob([buildZip(zipEntries)],{type:'application/zip'}),'recipes_xlsx.zip');
  document.getElementById('btnZipA').disabled=false;
  document.getElementById('btnZipA').querySelector('svg').style.opacity='1';
});

// ══════════════════════════════ PANEL B ══════════════════════
let xlsxEntries=[];  // {file, base, rows:[{...}], status}
let imgList=[];      // {file, name, clean, dataUrl}
let manualMap={};    // title → {dataUrl, name}

function readFileText(f){return new Promise(r=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsText(f);})}
function readDataUrl(f){return new Promise(r=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsDataURL(f);})}
function readArrayBuffer(f){return new Promise(r=>{const fr=new FileReader();fr.onload=e=>r(e.target.result);fr.readAsArrayBuffer(f);})}

// Load XLSX or CSV files
document.getElementById('inXlsx').addEventListener('change',async function(e){
  const nf=[...e.target.files];
  for(const f of nf){
    const name=f.name.toLowerCase();
    const base=f.name.replace(/\.(xlsx|csv)$/i,'');
    let rows=[];

    if(name.endsWith('.csv')){
      const text=await readFileText(f);
      rows=Papa.parse(text,{header:true,skipEmptyLines:true}).data;
    } else if(name.endsWith('.xlsx')){
      try{
        const ab=await readArrayBuffer(f);
        const wb2=new ExcelJS.Workbook();
        await wb2.xlsx.load(ab);
        const ws2=wb2.worksheets[0];
        if(!ws2) continue;
        const headers=[];
        ws2.getRow(1).eachCell((cell)=>{headers.push(cell.value||'');});
        ws2.eachRow((row,ri)=>{
          if(ri===1)return;
          const obj={};
          row.eachCell((cell,ci)=>{
            const key=headers[ci-1];
            if(key) obj[key]=typeof cell.value==='object'&&cell.value!==null&&cell.value.text?cell.value.text:(cell.value||'');
          });
          if(Object.keys(obj).length) rows.push(obj);
        });
      }catch(err){
        console.error('XLSX read error',err);
        continue;
      }
    } else continue;

    xlsxEntries.push({file:f,base,rows,status:'idle'});
  }
  document.getElementById('xlsxSub').textContent=xlsxEntries.length+' FILES';
  rebuildTable();
  this.value='';
});

// Load images
document.getElementById('inImg').addEventListener('change',async function(e){
  const nf=[...e.target.files].filter(f=>f.type.startsWith('image/'));
  for(const f of nf){
    const dataUrl=await readDataUrl(f);
    imgList.push({file:f,name:f.name,clean:cleanImgName(f.name),dataUrl});
  }
  document.getElementById('imgSub').textContent=imgList.length+' IMAGES';
  rebuildTable();this.value='';
});

function getAllTitles(){
  const seen=new Set();
  for(const e of xlsxEntries){
    for(const row of e.rows){
      if(row.Top_Title&&String(row.Top_Title).trim())seen.add(String(row.Top_Title).trim());
      if(row.Bottom_Title&&String(row.Bottom_Title).trim())seen.add(String(row.Bottom_Title).trim());
    }
  }
  return [...seen];
}

function rebuildTable(){
  if(!xlsxEntries.length)return;
  const titles=getAllTitles();
  const body=document.getElementById('matchBody');
  body.innerHTML='';
  let hits=0,misses=0;

  for(const title of titles){
    const img=manualMap[title]||findImage(title,imgList);
    const isHit=!!img;
    isHit?hits++:misses++;

    const row=document.createElement('div');
    row.className='mrow '+(isHit?'hit':'miss');
    row.dataset.title=title;

    const left=document.createElement('div');
    left.innerHTML=`<div class="recipe-name" title="${title}">${title}</div>`;

    if(isHit){
      const chip=document.createElement('div');
      chip.className='img-chip';
      chip.innerHTML=`<img src="${img.dataUrl}" alt=""><span>${img.name}</span>`;
      left.appendChild(chip);
    } else {
      const manBtn=document.createElement('button');
      manBtn.className='manual-upload-btn';
      manBtn.textContent='+ upload image';
      manBtn.onclick=()=>triggerManual(title,row);
      left.appendChild(manBtn);
    }

    const right=document.createElement('div');
    right.className='st';
    right.textContent=isHit?'✅':'❌';

    row.appendChild(left);row.appendChild(right);
    body.appendChild(row);
  }

  document.getElementById('matchTable').style.display='block';
  const ctr=document.getElementById('matchCounter');
  ctr.style.display='block';
  ctr.innerHTML=`<span class="c-hit"><b>${hits}</b> matched</span> · <span class="c-miss"><b>${misses}</b> missing</span>`;
  document.getElementById('btnMerge').disabled=!xlsxEntries.length;
}

function triggerManual(title,rowEl){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=async()=>{
    const f=inp.files[0];if(!f)return;
    const dataUrl=await readDataUrl(f);
    manualMap[title]={dataUrl,name:f.name};
    imgList.push({file:f,name:f.name,clean:cleanImgName(f.name),dataUrl});
    rebuildTable();
  };
  inp.click();
}

// ── MERGE → real XLSX with embedded images ───────────────────
document.getElementById('btnMerge').addEventListener('click',async()=>{
  document.getElementById('btnMerge').disabled=true;
  document.getElementById('outPills').innerHTML='';
  const zipEntries=[];

  for(const entry of xlsxEntries){
    // Build image map for this entry
    const imgMap={};
    for(const row of entry.rows){
      const topTitle=(row.Top_Title||'').trim();
      const botTitle=(row.Bottom_Title||'').trim();
      if(topTitle){
        const img=manualMap[topTitle]||findImage(topTitle,imgList);
        if(img) imgMap[topTitle]=img;
      }
      if(botTitle){
        const img=manualMap[botTitle]||findImage(botTitle,imgList);
        if(img) imgMap[botTitle]=img;
      }
    }

    // Build augmented rows (strip any old dataUrl values from image cols, we embed properly)
    const cleanRows=entry.rows.map(row=>{
      const r=Object.assign({},row);
      // Remove old base64 strings from image columns (they won't be embedded as text)
      if('Top_Image' in r) r.Top_Image='';
      if('Bottom_Image' in r) r.Bottom_Image='';
      return r;
    });

    try{
      entry.pill_spinner=document.createElement('div');
      entry.pill_spinner.className='pill';
      entry.pill_spinner.innerHTML=`<span class="pill-ico">📊</span><span class="pill-name">${entry.base}.xlsx</span><span class="pill-st"><span class="spin"></span></span>`;
      document.getElementById('outPills').appendChild(entry.pill_spinner);

      const bytes=await buildXlsx(cleanRows,imgMap);
      entry.status='done';
      entry.bytes=bytes;

      entry.pill_spinner.querySelector('.pill-st').textContent='✅';
      const b=document.createElement('button');b.className='dl';b.textContent='↓';
      b.onclick=()=>dlBlob(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),entry.base+'_with_images.xlsx');
      entry.pill_spinner.appendChild(b);

      zipEntries.push({name:entry.base+'_with_images.xlsx',bytes});
    }catch(err){
      console.error('Merge error',err);
      if(entry.pill_spinner) entry.pill_spinner.querySelector('.pill-st').textContent='❌';
    }
  }

  if(zipEntries.length){
    document.getElementById('btnZipB').disabled=false;
    document.getElementById('btnZipB')._zip=zipEntries;
  }
  document.getElementById('btnMerge').disabled=false;
});

document.getElementById('btnZipB').addEventListener('click',async function(){
  const e=this._zip;if(!e||!e.length)return;
  dlBlob(new Blob([buildZip(e)],{type:'application/zip'}),'recipes_merged_xlsx.zip');
});
</script>
