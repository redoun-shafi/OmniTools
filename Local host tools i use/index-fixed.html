<!DOCTYPE html>
<html>
<head>
  <title>Recipe Index Generator</title>

  <style>
    :root {
      --bg: #f5f7fb;
      --text: #222;
      --card: #ffffff;
      --border: #ddd;
      --accent: #4a6cf7;
    }

    body.dark {
      --bg: #1e1f26;
      --text: #eee;
      --card: #2a2c36;
      --border: #444;
      --accent: #7aa2ff;
    }

    body {
      font-family: "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      transition: 0.3s;
    }

    h1 {
      margin-bottom: 0;
    }

    h3 {
      margin-top: 5px;
      font-weight: normal;
      color: gray;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card {
      background: var(--card);
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-top: 15px;
    }

    .table-container {
      max-height: 600px;
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid var(--border);
      width: 180px;
      height: 30px;
      padding: 4px;
    }

    th {
      background: #f0f0f0;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    body.dark th {
      background: #333;
    }

    td input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
    }

    .buttons {
      margin-top: 10px;
    }

    button {
      padding: 8px 16px;
      margin-right: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: var(--accent);
      color: white;
    }

    .toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .progress-wrap {
      margin-top: 10px;
      background: var(--border);
      height: 8px;
      border-radius: 5px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: 0.2s;
    }

    .progress-text {
      font-size: 12px;
      margin-top: 4px;
    }

    pre {
      background: var(--card);
      padding: 10px;
      height: 250px;
      overflow: auto;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
  </style>
</head>

<body>

<div class="topbar">
  <div>
    <h1>Recipe Index Generator</h1>
    <h3>create by REDOUN</h3>
  </div>

  <button class="toggle" onclick="toggleTheme()">🌙 / ☀️</button>
</div>

<div class="card">

  <div class="table-container">
    <table id="grid"></table>
  </div>

  <div class="buttons">
    <button onclick="generate()">Generate</button>
    <button onclick="downloadDoc()">Download DOC</button>
  </div>

  <div class="progress-wrap">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <div class="progress-text" id="progressText">0%</div>

</div>

<h3>Output:</h3>

<pre id="output"></pre>

<script>

const rows = 200;
const cols = 3;

const table = document.getElementById("grid");


// HEADER
let header = "<tr><th></th>";

for (let c = 0; c < cols; c++) {
  header += `<th>${String.fromCharCode(65 + c)}</th>`;
}

header += "</tr>";

table.innerHTML += header;


// ROWS
for (let r = 0; r < rows; r++) {

  let rowHTML = `<tr><th>${r + 1}</th>`;

  for (let c = 0; c < cols; c++) {

    rowHTML += `
      <td>
        <input data-row="${r}" data-col="${c}">
      </td>
    `;
  }

  rowHTML += "</tr>";

  table.innerHTML += rowHTML;
}



// PASTE SYSTEM
table.addEventListener("paste", function(e) {

  const startCell = e.target;

  if (startCell.tagName !== "INPUT") return;

  e.preventDefault();

  const pasteData = e.clipboardData.getData("text");

  const rowsData = pasteData.split("\n");

  const startRow = parseInt(startCell.dataset.row);

  const startCol = parseInt(startCell.dataset.col);

  rowsData.forEach((row, i) => {

    const cells = row.split(/\t|,/);

    cells.forEach((cell, j) => {

      const target = document.querySelector(
        `input[data-row="${startRow + i}"][data-col="${startCol + j}"]`
      );

      if (target) target.value = cell.trim();

    });

  });

});




// GENERATE
function generate() {

  let data = [];

  const inputs = document.querySelectorAll("td input");

  const bar = document.getElementById("progressBar");

  const text = document.getElementById("progressText");

  let count = 0;

  let missingRows = [];


  inputs.forEach((input, i) => {

    const row = input.dataset.row;

    const col = input.dataset.col;


    if (col == 0) {

      const name = input.value.trim();

      const page = document.querySelector(
        `input[data-row="${row}"][data-col="1"]`
      ).value.trim();


      // WARNING CHECK
      if (name && !page) {
        missingRows.push(Number(row) + 1);
      }


      if (name && page) {
        data.push({ name, page });
      }

    }


    setTimeout(() => {

      count++;

      let percent = Math.floor((count / inputs.length) * 100);

      bar.style.width = percent + "%";

      text.innerText = percent + "%";

    }, i * 2);

  });



  setTimeout(() => {

    // WARNING
    if (missingRows.length > 0) {

      alert(
        "Warning!\n\nMissing page number in rows:\n" +
        missingRows.join(", ")
      );

    }


    // SORT
    data.sort((a, b) => a.name.localeCompare(b.name));

    let currentLetter = "";

    let output = [];


    data.forEach(item => {

      const letter = item.name.charAt(0).toUpperCase();

      if (letter !== currentLetter) {

        currentLetter = letter;

        output.push("\n" + letter);

      }

      const dots = "..........";

      output.push(item.name + " " + dots + item.page);

    });




    // COLUMN DIVIDE
    const total = output.length;

    const chunkSize = Math.ceil(total / 4);

    let finalOutput = "";


    for (let i = 0; i < 4; i++) {

      const start = i * chunkSize;

      const end = start + chunkSize;


      finalOutput += "\n\n";
      finalOutput += "==============================\n";
      finalOutput += "COLUMN " + (i + 1) + "\n";
      finalOutput += "==============================\n\n";


      finalOutput += output
        .slice(start, end)
        .join("\n");

    }


    document.getElementById("output").innerText = finalOutput;


    // COMPLETE MESSAGE
    alert("Recipe Index Generated Successfully!");

  }, inputs.length * 2);

}




// DOWNLOAD DOC
function downloadDoc() {

  const text = document.getElementById("output").innerText;

  const blob = new Blob([text], {
    type: "application/msword"
  });

  const a = document.createElement("a");

  a.href = URL.createObjectURL(blob);

  a.download = "Recipe_Index.doc";

  a.click();

}



// THEME TOGGLE
function toggleTheme() {
  document.body.classList.toggle("dark");
}

</script>

</body>
</html>
